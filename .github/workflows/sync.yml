name: Gmail PDF Sync

on:
  schedule:
    - cron: "0 7 * * *"   # täglich 07:00 UTC = 08:00 bzw. 09:00 Wien (Sommer/Winter)
  workflow_dispatch:        # manueller Trigger über GitHub UI (zum Testen)

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # nötig für git push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Gmail sync ausführen
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python gmail_invoices.py

      - name: JSON-Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rennweg.json data/aspangstrasse.json
          git diff --cached --quiet || git commit -m "chore: update energy data [skip ci]"
          git push
